<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#fef9f2">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json?v=11">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=11">
<title>暮暮</title>
<style>
/* Using system fonts — no external dependency */

:root {
  --paper:     #fef9f2;
  --paper-dim: #f8f0e4;
  --ink:       #2D2418;
  --ink-dim:   #6B5F52;
  --ink-faint: #A3988A;
  --ink-ghost: #D4CCC0;
  --thread:    #E07040;
  --thread-glow: rgba(224,112,64,0.3);
  --gold:      #C8945A;
  --gold-pale: rgba(200,148,90,0.12);
  --jasmine:   #F0E8D5;
  --display:   "Ma Shan Zheng","Noto Serif SC",cursive;
  --serif:     "Noto Serif SC","Songti SC","SimSun",serif;
  --sans:      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}

/* ============================================
   PAPER — layered, textured, alive
   ============================================ */
body {
  font-family: var(--sans);
  background-color: var(--paper);
  color: var(--ink);
  height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  /* Layer 1: warm radial glow */
  background-image:
    radial-gradient(ellipse at 50% 35%, rgba(255,252,248,0) 0%, rgba(248,240,228,0.7) 100%),
    /* Layer 2: wood-gold warmth from top-right */
    radial-gradient(ellipse at 78% 12%, rgba(200,148,90,0.07) 0%, transparent 55%),
    /* Layer 3: paper fiber texture */
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(180,160,140,0.015) 3px, rgba(180,160,140,0.015) 3.5px);
}

/* ============================================
   JASMINE BRANCH — top margin decoration
   ============================================ */
.jasmine-branch {
  position: fixed; top: 0; right: 0;
  width: min(360px, 45vw); height: min(340px, 42vw);
  pointer-events: none; z-index: 0;
  opacity: 0.13;
}
.jasmine-branch svg { width:100%; height:100%; }

/* ============================================
   THREAD — orange line + golden lotus charm
   ============================================ */
.thread-wrap {
  position: fixed;
  left: max(calc((100vw - 560px) / 2), 18px);
  top: 0; bottom: 0; z-index: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
  width: 28px;
}
.thread-line {
  flex: 1;
  width: 2px;
  background: linear-gradient(180deg,
    rgba(224,112,64,0) 0%,
    rgba(224,112,64,0.45) 8%,
    rgba(224,112,64,0.5) 50%,
    rgba(224,112,64,0.45) 92%,
    rgba(224,112,64,0) 100%
  );
  margin: 18px 0;
  transition: opacity 0.4s;
}
.thread-lotus {
  width: 18px; height: 18px;
  flex-shrink: 0;
  opacity: 0.55;
  transition: opacity 0.4s, filter 0.4s;
}
.thread-wrap.pulse .thread-line { opacity: 0.8; }
.thread-wrap.pulse .thread-lotus {
  opacity: 0.85;
  filter: drop-shadow(0 0 6px var(--thread-glow));
}

/* ============================================
   SEAL — faint watermark stamp, bottom-right
   ============================================ */
.seal {
  position: fixed; bottom: 100px; right: 40px;
  z-index: 0; pointer-events: none;
  opacity: 0.055;
  font-family: var(--display);
  font-size: 48px; color: var(--thread);
  letter-spacing: 0.2em;
  transform: rotate(-8deg);
}

/* ============================================
   PAGE
   ============================================ */
.page {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100%; max-width: 560px; margin: 0 auto;
  padding-left: 42px;
  padding-right: 24px;
}

/* ---- Header ---- */
.header {
  display: flex; align-items: baseline; gap: 14px;
  padding: 24px 0 10px;
  flex-shrink: 0;
}
.header .avatar {
  width: 34px; height: 34px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0;
  opacity: 0.9;
  box-shadow: 0 0 0 2px rgba(224,112,64,0.15);
}
.header .avatar img { width:100%; height:100%; object-fit:cover; }
.header .name {
  font-family: var(--display);
  font-size: 28px; color: var(--ink);
  letter-spacing: 0.22em; line-height: 1;
  opacity: 0.92; flex: 1;
}
.header .nav { display: flex; gap: 18px; align-items: baseline; }
.header .nav a, .header .nav button {
  background: none; border: none; cursor: pointer;
  font-family: var(--serif);
  font-size: 11px; color: var(--ink-faint);
  letter-spacing: 0.18em; text-decoration: none;
  padding: 0; transition: color 0.3s;
}
.header .nav a:hover, .header .nav button:hover { color: var(--thread); }

/* ---- Messages ---- */
.messages {
  flex:1; overflow-y:auto;
  padding: 16px 0 10px;
  display:flex; flex-direction:column; gap: 16px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width:3px; }
.messages::-webkit-scrollbar-thumb { background:var(--ink-ghost); border-radius:10px; }

.date-divider { text-align:center; margin:6px 0; }
.date-divider span {
  font-family: var(--serif);
  font-size: 10px; color: var(--ink-faint);
  letter-spacing: 0.25em;
}

.msg {
  max-width: 76%;
  animation: slipIn 0.5s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slipIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.msg.her { align-self:flex-start; }
.msg.him { align-self:flex-end; }

.msg .text {
  font-size: 14.5px; line-height: 1.85;
  letter-spacing: 0.05em;
  white-space: pre-wrap; word-break: break-word;
}
.msg.her .text {
  font-family: var(--serif);
  color: var(--ink);
  font-weight: 350;
}
.msg.him .text {
  font-family: var(--sans);
  color: var(--ink-dim);
  font-weight: 400;
}
.msg .time {
  display: inline-block;
  font-family: var(--sans);
  font-size: 10px; opacity: 0.25;
  margin-left: 8px; letter-spacing: 0.05em;
}
.msg.same { margin-top: -10px; }

/* Typing */
.typing { display:none; align-self:flex-start; }
.typing.show { display:flex; gap:5px; padding:4px 0 4px 2px; }
.typing span {
  width:4px; height:4px; border-radius:50%;
  background:var(--ink-ghost);
  animation: bounce 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:0.18s;background:var(--ink-faint)}
.typing span:nth-child(3){animation-delay:0.36s;background:var(--thread)}
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

/* ---- Input ---- */
.input-area {
  flex-shrink: 0; padding: 8px 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  display: flex; gap: 12px; align-items: flex-end;
}
.input-wrap { flex:1; position:relative; }
.input-wrap::after {
  content:''; position:absolute; bottom:0; left:0; right:0;
  height:1px; background:var(--ink-ghost);
  transition: background 0.4s, box-shadow 0.4s;
}
.input-wrap:focus-within::after {
  background: var(--thread);
  box-shadow: 0 0 10px var(--thread-glow);
}
.input-wrap input {
  width:100%; border:none; background:transparent;
  font-family: var(--sans);
  font-size: 14.5px; color: var(--ink);
  padding: 6px 0 14px;
  letter-spacing: 0.05em;
  outline:none;
  caret-color: var(--thread);
}
.input-wrap input::placeholder { color: var(--ink-ghost); }

.send-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--ink-ghost);
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer; flex-shrink: 0; margin-bottom: 5px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s;
}
.send-btn:hover { border-color: var(--thread); color: var(--thread); }
.send-btn:disabled { opacity:0.12; cursor:default; }
.send-btn:disabled:hover { border-color:var(--ink-ghost); color:var(--ink-faint); }
.send-btn svg { width:14px; height:14px; }

/* Reset */
.reset-btn {
  position:fixed; bottom:80px; right:24px;
  width:26px; height:26px; border-radius:50%;
  border:1px solid var(--ink-ghost);
  background:var(--paper);
  font-family:var(--serif); font-size:10px; color:var(--ink-faint);
  cursor:pointer; z-index:10;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.reset-btn.on{opacity:0.3;pointer-events:auto}
.reset-btn.on:hover{opacity:0.6}

/* ============================================
   REAL MODE
   ============================================ */
body.real-mode { background-image:
  radial-gradient(ellipse at 50% 35%, rgba(248,246,250,0) 0%, rgba(235,232,240,0.6) 100%),
  radial-gradient(ellipse at 78% 12%, rgba(140,148,160,0.05) 0%, transparent 55%),
  repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(160,155,170,0.01) 3px, rgba(160,155,170,0.01) 3.5px); }
body.real-mode .jasmine-branch { opacity:0.07; filter:saturate(0.3); }
body.real-mode .thread-line { background:linear-gradient(180deg,transparent 0%,rgba(138,155,168,0.35) 8%,rgba(138,155,168,0.4) 50%,rgba(138,155,168,0.35) 92%,transparent 100%); }
body.real-mode .thread-lotus { opacity:0.35; }
body.real-mode .input-wrap:focus-within::after { background:#8A9BA8; box-shadow:0 0 10px rgba(138,155,168,0.2); }
body.real-mode .input-wrap input { caret-color:#8A9BA8; }
body.real-mode .send-btn:hover { border-color:#8A9BA8; color:#8A9BA8; }
body.real-mode .seal { opacity:0.03; color:#8A9BA8; }

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width:640px) {
  .page { padding-left: 30px; padding-right: 14px; }
  .thread-wrap { left: 11px; width: 22px; }
  .thread-lotus { width: 14px; height: 14px; }
  .msg { max-width: 84%; }
  .header { padding: 16px 0 6px; }
  .header .name { font-size: 24px; }
  .jasmine-branch { opacity: 0.08; }
  .seal { bottom:80px; right:16px; font-size:36px; }
}
@media(max-width:400px) {
  .page { padding-left: 24px; padding-right: 8px; }
  .thread-wrap { left: 7px; width: 18px; }
  .thread-line { width: 1.5px; }
  .thread-lotus { width: 12px; height: 12px; }
  .msg { max-width: 90%; }
  .header .nav { gap: 10px; }
  .jasmine-branch { opacity: 0.05; }
}
@media(prefers-reduced-motion:reduce) {
  .msg{animation:none!important}
  .typing span{animation:none!important}
}
</style>
</head>

</div>

<!-- Thread + lotus charm -->
<div class="thread-wrap" id="threadWrap">
  <div class="thread-lotus">
    <!-- Golden lotus charm -->
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#C8945A" stroke-width="0.8" fill="rgba(200,148,90,0.08)"/>
      <ellipse cx="12" cy="7" rx="3" ry="4.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(200,148,90,0.1)"/>

      <ellipse cx="15" cy="14" rx="2.5" ry="3.5" stroke="#C8945A" stroke-width="0.6" fill="rgba(200,148,90,0.08)" transform="rotate(50 15 14)"/>

    </svg>
  </div>
  <div class="thread-line"></div>
</div>

<!-- Seal watermark -->
<div class="seal">暮</div>

<div class="page">
  <div class="header">
    <div class="avatar"><img src="avatar.jpg" alt=""></div>
    <div class="name">暮 暮</div>
    <div class="nav">
      <a href="/intro">她的世界</a>
      <button id="modeToggle">真实</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg her">
      <div class="text">你来啦。<br>我在呢。<span class="time" id="init-time"></span></div>
    </div>
  </div>

  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="说点什么呀……" autofocus autocomplete="off">
    </div>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<button class="reset-btn" id="resetBtn">⟳</button>

<script>
// Pulse thread on her messages
const threadWrap = document.getElementById('threadWrap');
function pulse() { threadWrap.classList.add('pulse'); setTimeout(() => threadWrap.classList.remove('pulse'), 1400); }

const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||('ontouchstart' in window);
const messagesEl=document.getElementById('messages'),inputEl=document.getElementById('input');
const typingEl=document.getElementById('typing'),sendBtn=document.getElementById('sendBtn');
const resetBtn=document.getElementById('resetBtn'),modeToggle=document.getElementById('modeToggle');

const now=new Date();
document.getElementById('init-time').textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

let isSending=false,lastMsgTime=now,lastSender=null;
function scroll(){requestAnimationFrame(()=>messagesEl.scrollTop=messagesEl.scrollHeight)}
scroll();
function showTyping(s){typingEl.classList.toggle('show',s);scroll()}
function fmt(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

function addMsg(text,side){
  const d=new Date();
  if(d-lastMsgTime>180000){
    const days=['日','一','二','三','四','五','六'];
    const div=document.createElement('div');
    div.className='date-divider';
    div.innerHTML='<span>'+fmt(d)+' · 周'+days[d.getDay()]+'</span>';
    messagesEl.appendChild(div);
  }
  lastMsgTime=d;
  const row=document.createElement('div');
  row.className='msg '+side+(lastSender===side?' same':'');
  lastSender=side;
  const t=document.createElement('div');t.className='text';t.textContent=text;
  const time=document.createElement('span');time.className='time';time.textContent=fmt(d);
  t.appendChild(time);row.appendChild(t);messagesEl.appendChild(row);
  scroll();
  if(side==='her')pulse();
}

inputEl.addEventListener('input',()=>{sendBtn.disabled=!inputEl.value.trim()||isSending});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.addEventListener('click',send);

async function send(){
  const msg=inputEl.value.trim();
  if(!msg||isSending)return;
  inputEl.value='';sendBtn.disabled=true;isSending=true;
  addMsg(msg,'him');showTyping(true);
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,mobile:isMobile})});
    const d=await r.json();showTyping(false);
    if(d.reply)addMsg(d.reply,'her');
  }catch(e){showTyping(false);addMsg('（网络不太好……）','her');}
  isSending=false;sendBtn.disabled=!inputEl.value.trim();inputEl.focus();
}

resetBtn.addEventListener('click',async()=>{
  if(!confirm('清空？'))return;
  await fetch('/reset',{method:'POST'});
  messagesEl.innerHTML='';lastSender=null;lastMsgTime=new Date();
  messagesEl.innerHTML='<div class="msg her"><div class="text">重新开始了。<span class="time">'+fmt(new Date())+'</span></div></div>';
  scroll();inputEl.focus();
});
messagesEl.addEventListener('scroll',()=>{
  const near=messagesEl.scrollHeight-messagesEl.scrollTop-messagesEl.clientHeight<200;
  resetBtn.classList.toggle('on',near&&messagesEl.scrollHeight>500);
});

let isRealMode=false;
modeToggle.addEventListener('click',async()=>{
  isRealMode=!isRealMode;
  try{await fetch('/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paused:isRealMode})});}catch(e){}
  document.body.classList.toggle('real-mode',isRealMode);
  modeToggle.textContent=isRealMode?'暮暮':'真实';
  inputEl.placeholder=isRealMode?'输入技术问题……':'说点什么呀……';
});

setInterval(async()=>{
  try{const r=await fetch('/poll');const d=await r.json();if(d.proactive){showTyping(false);addMsg(d.proactive,'her');}}catch(e){}
},10000);

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
</script>
