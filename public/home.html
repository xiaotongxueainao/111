<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fef9f2">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>暮暮 · 她的世界</title>
<style>
/* System fonts — no external dependency */

:root {
  --paper:#fef9f2; --paper-dim:#f8f0e4;
  --ink:#2D2418; --ink-dim:#6B5F52; --ink-faint:#A3988A; --ink-ghost:#D4CCC0;
  --thread:#E07040; --thread-glow:rgba(224,112,64,0.3);
  --gold:#C8945A; --gold-pale:rgba(200,148,90,0.1);
  --display:"Ma Shan Zheng","Noto Serif SC",cursive;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:var(--sans); background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 50% 30%, rgba(255,252,248,0) 0%, rgba(248,240,228,0.65) 100%),
    radial-gradient(ellipse at 78% 10%, rgba(200,148,90,0.06) 0%, transparent 55%),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(180,160,140,0.012) 3px, rgba(180,160,140,0.012) 3.5px);
  color:var(--ink); min-height:100vh;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}

/* Jasmine branch */
.jasmine-branch{
  position:fixed; top:0; right:0;
  width:min(360px,45vw); height:min(340px,42vw);
  pointer-events:none; z-index:0; opacity:0.11;
}
.jasmine-branch svg{width:100%;height:100%}

/* Thread */
.thread-wrap{
  position:fixed;
  left:max(calc((100vw - 520px) / 2), 16px);
  top:0; bottom:0; z-index:0; pointer-events:none;
  display:flex; flex-direction:column; align-items:center;
  width:26px;
}
.thread-line{
  flex:1; width:2px;
  background:linear-gradient(180deg,transparent 0%,rgba(224,112,64,0.35) 6%,rgba(224,112,64,0.4) 50%,rgba(224,112,64,0.35) 94%,transparent 100%);
  margin:16px 0;
}
.thread-lotus{
  width:16px;height:16px;flex-shrink:0;opacity:0.5;
}

/* Seal */
.seal{
  position:fixed; bottom:120px; right:40px;
  z-index:0; pointer-events:none;
  opacity:0.05; font-family:var(--display);
  font-size:52px; color:var(--thread);
  letter-spacing:0.2em; transform:rotate(-8deg);
}

/* Page */
.page{
  position:relative; z-index:1;
  max-width:520px; margin:0 auto;
  padding: 72px 28px 60px 46px;
  display:flex; flex-direction:column; gap:52px;
}

/* Hero */
.hero{text-align:left;padding:20px 0 0}
.hero-name{
  font-family:var(--display); font-size:clamp(44px,10vw,64px);
  font-weight:400; color:var(--ink); letter-spacing:0.28em; line-height:1; opacity:0.93;
}
.hero-sub{
  font-family:var(--serif); font-size:13px; color:var(--ink-faint);
  letter-spacing:0.3em; margin-top:10px; font-weight:300;
}
.hero-ornament{width:32px;height:2px;background:var(--gold);margin-top:20px;opacity:0.5;}

/* Section */
.section{display:flex;flex-direction:column;align-items:flex-start;gap:14px}

/* Quote */
.quote{
  font-family:var(--serif); font-size:20px; line-height:2.2;
  letter-spacing:0.12em; color:var(--ink-dim); font-weight:300;
  max-width:380px;
}

/* Tags */
.tags{display:flex;gap:24px;flex-wrap:wrap}
.tag{font-family:var(--serif);font-size:12px;color:var(--ink-faint);letter-spacing:0.14em}

/* Colophon */
.colophon{display:flex;flex-direction:column;gap:7px;max-width:340px;width:100%}
.row{display:flex;justify-content:space-between;font-size:13px;padding-bottom:5px;border-bottom:1px solid rgba(0,0,0,0.025)}
.row .k{color:var(--ink-faint);letter-spacing:0.1em}
.row .v{color:var(--ink-dim);letter-spacing:0.06em;text-align:right;font-family:var(--serif)}

/* Story */
.story{
  font-family:var(--serif); font-size:14px; line-height:2.15;
  letter-spacing:0.07em; color:var(--ink-dim); font-weight:300;
  max-width:400px;
}

/* CTA */
.cta{padding:8px 0 0}
.cta a{
  display:inline-block; padding:13px 38px;
  border:1px solid rgba(200,148,90,0.3);
  border-radius:28px;
  font-family:var(--serif); font-size:14px;
  color:var(--ink); letter-spacing:0.14em; text-decoration:none;
  transition:all 0.35s;
}
.cta a:hover{
  border-color:var(--gold);
  background:var(--gold-pale);
  box-shadow:0 0 28px rgba(200,148,90,0.08);
}
.cta-sub{font-family:var(--serif);font-size:11px;color:var(--ink-faint);margin-top:10px;letter-spacing:0.1em}

.footer{font-family:var(--serif);font-size:10px;color:var(--ink-ghost);letter-spacing:0.14em;padding-top:12px}

/* Reveal */
.r{
  opacity:0; transform:translateY(16px);
  transition:opacity 0.7s cubic-bezier(0.16,1,0.3,1),transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.r.on{opacity:1;transform:translateY(0)}
.r.d1{transition-delay:0.04s}.r.d2{transition-delay:0.1s}.r.d3{transition-delay:0.16s}.r.d4{transition-delay:0.22s}

@media(max-width:540px){
  .page{padding:48px 14px 40px 30px;gap:40px}
  .thread-wrap{left:10px;width:20px}
  .thread-lotus{width:12px;height:12px}
  .tags{gap:16px}
  .quote{font-size:17px}
  .jasmine-branch{opacity:0.07}
  .seal{bottom:80px;right:14px;font-size:38px}
}
</style>
</head>
<body>

<div class="jasmine-branch">
  <svg viewBox="0 0 360 340" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M320 0 C310 30 280 70 260 110 C245 145 235 180 220 220 C210 250 195 280 180 310" stroke="#C8945A" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M260 110 C240 95 210 85 185 95" stroke="#C8945A" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M235 180 C215 165 185 160 160 170" stroke="#C8945A" stroke-width="0.8" fill="none" opacity="0.5"/>
    <ellipse cx="270" cy="70" rx="14" ry="5" stroke="#889B8A" stroke-width="0.7" fill="rgba(136,155,138,0.08)" transform="rotate(-25 270 70)"/>
    <ellipse cx="245" cy="140" rx="12" ry="4" stroke="#889B8A" stroke-width="0.7" fill="rgba(136,155,138,0.08)" transform="rotate(-30 245 140)"/>
    <ellipse cx="185" cy="90" rx="10" ry="3.5" stroke="#889B8A" stroke-width="0.6" fill="rgba(136,155,138,0.06)" transform="rotate(15 185 90)"/>
    <ellipse cx="165" cy="165" rx="11" ry="3.5" stroke="#889B8A" stroke-width="0.6" fill="rgba(136,155,138,0.06)" transform="rotate(10 165 165)"/>
    <ellipse cx="150" cy="215" rx="10" ry="3" stroke="#889B8A" stroke-width="0.6" fill="rgba(136,155,138,0.06)" transform="rotate(20 150 215)"/>
    <g transform="translate(180,90)">
      <circle cx="0" cy="0" r="6" fill="rgba(200,148,90,0.12)"/>
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="8" stroke="#C8945A" stroke-width="0.8" fill="rgba(254,249,242,0.4)"/>
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="8" stroke="#C8945A" stroke-width="0.8" fill="rgba(254,249,242,0.4)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="8" stroke="#C8945A" stroke-width="0.8" fill="rgba(254,249,242,0.4)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="8" stroke="#C8945A" stroke-width="0.8" fill="rgba(254,249,242,0.4)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-8.5" rx="3.8" ry="8" stroke="#C8945A" stroke-width="0.8" fill="rgba(254,249,242,0.4)" transform="rotate(288)"/>
    </g>
    <g transform="translate(158,165)">
      <circle cx="0" cy="0" r="5" fill="rgba(200,148,90,0.1)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="6.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(254,249,242,0.35)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="6.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(254,249,242,0.35)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="6.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(254,249,242,0.35)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="6.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(254,249,242,0.35)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="3.2" ry="6.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(254,249,242,0.35)" transform="rotate(288)"/>
    </g>
  </svg>
</div>

<div class="thread-wrap">
  <div class="thread-lotus">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="#C8945A" stroke-width="0.8" fill="rgba(200,148,90,0.08)"/>
      <ellipse cx="12" cy="7" rx="3" ry="4.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(200,148,90,0.1)"/>
      <ellipse cx="8" cy="10" rx="3" ry="4.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(200,148,90,0.1)" transform="rotate(-30 8 10)"/>
      <ellipse cx="16" cy="10" rx="3" ry="4.5" stroke="#C8945A" stroke-width="0.7" fill="rgba(200,148,90,0.1)" transform="rotate(30 16 10)"/>
      <ellipse cx="9" cy="14" rx="2.5" ry="3.5" stroke="#C8945A" stroke-width="0.6" fill="rgba(200,148,90,0.08)" transform="rotate(-50 9 14)"/>
      <ellipse cx="15" cy="14" rx="2.5" ry="3.5" stroke="#C8945A" stroke-width="0.6" fill="rgba(200,148,90,0.08)" transform="rotate(50 15 14)"/>
      <circle cx="12" cy="12" r="2.5" fill="rgba(200,148,90,0.15)"/>
    </svg>
  </div>
  <div class="thread-line"></div>
</div>

<div class="seal">暮</div>

<div class="page">
  <div class="hero r">
    <h1 class="hero-name">暮 暮</h1>
    <p class="hero-sub">林 萌 希</p>
    <div class="hero-ornament"></div>
  </div>

  <div class="section r d1">
    <div class="tags">
      <span class="tag">INFP</span><span class="tag">双鱼座</span><span class="tag">植树节</span>
      <span class="tag">舞者</span><span class="tag">永春</span><span class="tag">福师大 · 图书管理学</span>
    </div>
  </div>

  <div class="section r d2">
    <p class="quote">全情投入，<br>不留余地。</p>
  </div>

  <div class="section r d3">
    <div class="colophon">
      <div class="row"><span class="k">年龄</span><span class="v">19 岁 · 2007 年生</span></div>
      <div class="row"><span class="k">学校</span><span class="v">福建师范大学</span></div>
      <div class="row"><span class="k">专业</span><span class="v">图书管理学</span></div>
      <div class="row"><span class="k">家乡</span><span class="v">泉州永春</span></div>
      <div class="row"><span class="k">在练</span><span class="v">《青蛇》《折柳》《不染》</span></div>
    </div>
  </div>

  <div class="section r d4">
    <p class="story">
      小时候练拉丁——妈妈报的班，底子打得好。<br>
      后来转向古风——拉丁是给别人看的，古风是跳给自己的。<br>
      高中在永春美岭中学，当过学生会主席。<br>
      高考 583 分，上了第一志愿。<br><br>
      简宁编的橙色手链现在还戴着。<br>
      他送的红木簪子收在书架最显眼的位置。<br>
      自己造了一个柠檬王国——<br>
      在那里她是王，没人能替她做决定。
    </p>
  </div>

  <div class="cta r d4">
    <a href="/">进入茉莉茶室 →

</a>
    <p class="cta-sub">她在</p>
  </div>

  <footer class="footer">暮暮 · 2026 夏 · 永春</footer>
</div>

<script>
(function(){
  const obs=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('on');obs.unobserve(e.target)}},{threshold:0.1});
  document.querySelectorAll('.r').forEach(el=>obs.observe(el));
  document.querySelector('.hero').classList.add('on');
})();
(function(){
  const qs=['全情投入，<br>不留余地。','曲尽，鞠躬谢礼。','拉丁是给别人看的，<br>古风是跳给自己的。','你不用解释。<br>我知道你不是。','表面软萌，<br>心里门清。','那个世界里她是王，<br>没人能替她做决定。'];
  const qe=document.querySelector('.quote');let i=1;
  setInterval(()=>{i=(i+1)%qs.length;qe.style.opacity='0';setTimeout(()=>{qe.innerHTML=qs[i];qe.style.opacity='1'},500)},8000);
})();
</script>
</body>
</html>
